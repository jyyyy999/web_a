<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웹 계산기</title>
<style>
  :root {
    --bg: #f3f4f7;
    --panel: #ffffff;
    --text: #1d2129;
    --muted: #6b7280;
    --line: #e3e5ea;
    --key: #f1f2f5;
    --key-hover: #e6e8ec;
    --fn: #e3e8f4;
    --fn-hover: #d5dcec;
    --accent: #3b63d8;
    --accent-hover: #3255bf;
    --danger: #d9534f;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
  }
  .app {
    max-width: 860px;
    margin: 32px auto;
    padding: 0 16px;
  }

  /* ── 탭 ── */
  .tabs {
    display: flex;
    gap: 4px;
    background: #e4e6eb;
    padding: 4px;
    border-radius: var(--radius);
    margin-bottom: 16px;
  }
  .tab {
    flex: 1;
    padding: 12px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
  }
  .tab.active { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .panel { display: none; }
  .panel.active { display: block; }

  .card {
    background: var(--panel);
    border-radius: var(--radius);
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    padding: 20px;
  }

  /* ── 공학용 계산기 ── */
  .calc-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 260px;
    gap: 16px;
  }
  .display {
    background: #1f2430;
    color: #fff;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 14px;
    text-align: right;
    min-height: 96px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }
  .display .expr {
    font-size: 15px;
    color: #9aa3b5;
    min-height: 20px;
    word-break: break-all;
  }
  .display .main {
    font-size: 34px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    word-break: break-all;
    line-height: 1.2;
  }
  .display .main.error { color: #ff8a80; font-size: 22px; }

  .keys {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .keys button {
    height: 54px;
    border: 0;
    border-radius: 9px;
    background: var(--key);
    font: inherit;
    font-size: 18px;
    color: var(--text);
    cursor: pointer;
    transition: background .1s, transform .05s;
  }
  .keys button:hover { background: var(--key-hover); }
  .keys button:active, .keys button.pressed { transform: scale(.96); }
  .keys .fn { background: var(--fn); }
  .keys .fn:hover { background: var(--fn-hover); }
  .keys .op { background: var(--fn); color: var(--accent); font-weight: 700; }
  .keys .op:hover { background: var(--fn-hover); }
  .keys .clear { color: var(--danger); font-weight: 700; }
  .keys .eq { background: var(--accent); color: #fff; font-weight: 700; }
  .keys .eq:hover { background: var(--accent-hover); }

  .history h3 {
    margin: 0 0 10px;
    font-size: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .history .clear-history {
    border: 0;
    background: none;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .history .clear-history:hover { color: var(--danger); }
  .history ul {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 380px;
    overflow-y: auto;
  }
  .history li {
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    text-align: right;
    border-bottom: 1px solid var(--line);
  }
  .history li:hover { background: var(--key); }
  .history li .h-expr { font-size: 13px; color: var(--muted); word-break: break-all; }
  .history li .h-res { font-size: 18px; font-weight: 600; word-break: break-all; }
  .history .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 24px 0; cursor: default; border: 0; }
  .history .empty:hover { background: none; }
  .hint { margin-top: 12px; font-size: 12px; color: var(--muted); }

  /* ── 단위 변환기 ── */
  .conv label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .conv select, .conv input {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 9px;
    font: inherit;
    font-size: 16px;
    background: #fff;
    color: var(--text);
  }
  .conv select:focus, .conv input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .conv .row { margin-bottom: 18px; }
  .conv-grid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 12px;
    align-items: end;
  }
  .conv .side { display: flex; flex-direction: column; gap: 8px; }
  .conv .result {
    padding: 12px;
    border-radius: 9px;
    background: var(--key);
    font-size: 16px;
    min-height: 47px;
    word-break: break-all;
    font-variant-numeric: tabular-nums;
  }
  .swap {
    width: 48px;
    height: 48px;
    border: 0;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    margin-bottom: 30px;
  }
  .swap:hover { background: var(--accent-hover); }
  .conv .summary {
    margin-top: 18px;
    padding: 14px;
    border-radius: 9px;
    background: #eef2fc;
    color: var(--accent);
    font-weight: 600;
    text-align: center;
    min-height: 48px;
  }

  @media (max-width: 680px) {
    .calc-layout { grid-template-columns: 1fr; }
    .conv-grid { grid-template-columns: 1fr; }
    .swap { margin: 0 auto; transform: rotate(90deg); }
  }
</style>
</head>
<body>
<div class="app">
  <nav class="tabs">
    <button class="tab active" data-target="#calc">공학용 계산기</button>
    <button class="tab" data-target="#converter">단위 변환기</button>
  </nav>

  <!-- ───────── 공학용 계산기 ───────── -->
  <section id="calc" class="panel active">
    <div class="calc-layout">
      <div class="card">
        <div class="display">
          <div class="expr" id="exprLine"></div>
          <div class="main" id="mainLine">0</div>
        </div>
        <div class="keys">
          <button class="fn clear" data-action="clear">AC</button>
          <button class="fn" data-action="back">⌫</button>
          <button class="fn" data-input="(">(</button>
          <button class="fn" data-input=")">)</button>
          <button class="op" data-input="÷">÷</button>

          <button class="fn" data-action="sqrt">√</button>
          <button data-input="7">7</button>
          <button data-input="8">8</button>
          <button data-input="9">9</button>
          <button class="op" data-input="×">×</button>

          <button class="fn" data-action="square">x²</button>
          <button data-input="4">4</button>
          <button data-input="5">5</button>
          <button data-input="6">6</button>
          <button class="op" data-input="−">−</button>

          <button class="fn" data-action="percent">%</button>
          <button data-input="1">1</button>
          <button data-input="2">2</button>
          <button data-input="3">3</button>
          <button class="op" data-input="+">+</button>

          <button class="fn" data-action="negate">±</button>
          <button data-input="0">0</button>
          <button data-input=".">.</button>
          <button class="eq" data-action="equals" style="grid-column: span 2;">=</button>
        </div>
        <p class="hint">키보드: 숫자 · + − * / · ( ) · % · Enter(=) · Backspace(⌫) · Esc(AC)</p>
      </div>

      <aside class="card history">
        <h3>계산 기록 <button class="clear-history" id="clearHistory">지우기</button></h3>
        <ul id="historyList">
          <li class="empty">기록이 없습니다</li>
        </ul>
      </aside>
    </div>
  </section>

  <!-- ───────── 단위 변환기 ───────── -->
  <section id="converter" class="panel">
    <div class="card conv">
      <div class="row">
        <label for="category">카테고리</label>
        <select id="category">
          <option value="length">길이</option>
          <option value="weight">무게</option>
          <option value="temperature">온도</option>
          <option value="data">데이터</option>
        </select>
      </div>
      <div class="conv-grid">
        <div class="side">
          <label for="fromValue">값</label>
          <input type="number" id="fromValue" value="1" step="any" inputmode="decimal">
          <select id="fromUnit" aria-label="변환할 단위"></select>
        </div>
        <button class="swap" id="swapUnits" title="단위 바꾸기">⇄</button>
        <div class="side">
          <label>결과</label>
          <div class="result" id="toValue"></div>
          <select id="toUnit" aria-label="결과 단위"></select>
        </div>
      </div>
      <div class="summary" id="convSummary"></div>
      <p class="hint" id="convNote"></p>
    </div>
  </section>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
/* =========================================================
 *  수식 파서 (eval / Function 사용 안 함)
 *  재귀 하강 파서 문법:
 *    expr    := term (('+' | '-') term)*
 *    term    := unary (('*' | '/') unary | <암시적 곱셈> unary)*
 *    unary   := ('-' | '+') unary | postfix
 *    postfix := primary ('²' | '%')*
 *    primary := number | '(' expr ')'? | '√' unary
 *  닫히지 않은 괄호는 식 끝에서 자동으로 닫힌 것으로 처리.
 * ========================================================= */
const Calc = (function () {
  function CalcError(msg) { this.message = msg; }

  function tokenize(src) {
    const tokens = [];
    let i = 0;
    while (i < src.length) {
      const c = src[i];
      if (c === ' ') { i++; continue; }
      if (/[0-9.]/.test(c)) {
        const m = src.slice(i).match(/^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i);
        if (!m) throw new CalcError('잘못된 숫자');
        tokens.push({ type: 'num', value: parseFloat(m[0]) });
        i += m[0].length;
        continue;
      }
      const map = {
        '+': ['op', '+'], '-': ['op', '-'], '−': ['op', '-'],
        '*': ['op', '*'], '×': ['op', '*'], '/': ['op', '/'], '÷': ['op', '/'],
        '(': ['lp'], ')': ['rp'], '√': ['sqrt'], '²': ['sq'], '%': ['pct']
      };
      if (!map[c]) throw new CalcError('알 수 없는 문자: ' + c);
      tokens.push({ type: map[c][0], value: map[c][1] });
      i++;
    }
    return tokens;
  }

  function parse(tokens) {
    let pos = 0;
    const peek = () => tokens[pos];
    const next = () => tokens[pos++];
    const isOp = (t, v) => t && t.type === 'op' && t.value === v;

    function expr() {
      let v = term();
      while (isOp(peek(), '+') || isOp(peek(), '-')) {
        const op = next().value;
        const r = term();
        v = op === '+' ? v + r : v - r;
      }
      return v;
    }

    function term() {
      let v = unary();
      for (;;) {
        const t = peek();
        if (isOp(t, '*')) { next(); v *= unary(); }
        else if (isOp(t, '/')) {
          next();
          const r = unary();
          if (r === 0) throw new CalcError('0으로 나눌 수 없습니다');
          v /= r;
        }
        // 2(3), 2√9, (1)(2) 같은 암시적 곱셈
        else if (t && (t.type === 'num' || t.type === 'lp' || t.type === 'sqrt')) { v *= unary(); }
        else break;
      }
      return v;
    }

    function unary() {
      if (isOp(peek(), '-')) { next(); return -unary(); }
      if (isOp(peek(), '+')) { next(); return unary(); }
      return postfix();
    }

    function postfix() {
      let v = primary();
      for (;;) {
        const t = peek();
        if (t && t.type === 'sq') { next(); v = v * v; }
        else if (t && t.type === 'pct') { next(); v = v / 100; }
        else break;
      }
      return v;
    }

    function primary() {
      const t = next();
      if (!t) throw new CalcError('수식이 완성되지 않았습니다');
      if (t.type === 'num') return t.value;
      if (t.type === 'lp') {
        const v = expr();
        if (peek() && peek().type === 'rp') next();
        else if (peek()) throw new CalcError('괄호가 맞지 않습니다');
        return v;
      }
      if (t.type === 'sqrt') {
        const v = unary();
        if (v < 0) throw new CalcError('음수의 제곱근은 계산할 수 없습니다');
        return Math.sqrt(v);
      }
      throw new CalcError('잘못된 수식');
    }

    if (tokens.length === 0) throw new CalcError('수식이 비어 있습니다');
    const result = expr();
    if (pos < tokens.length) throw new CalcError(tokens[pos].type === 'rp' ? '괄호가 맞지 않습니다' : '잘못된 수식');
    return result;
  }

  function evaluate(src) {
    try {
      const v = parse(tokenize(src));
      if (!isFinite(v)) return { error: '계산 범위를 벗어났습니다' };
      return { value: v };
    } catch (e) {
      if (e instanceof CalcError) return { error: e.message };
      throw e;
    }
  }

  // 부동소수점 오차 정리 (0.1+0.2 → 0.3)
  function format(v) {
    if (Object.is(v, -0)) v = 0;
    return String(parseFloat(v.toPrecision(12)));
  }

  return { evaluate, format };
})();

/* =========================================================
 *  계산기 UI
 * ========================================================= */
$(function () {
  let expr = '';            // 현재 입력 중인 수식
  let justEvaluated = false; // 방금 = 를 눌렀는지
  let lastResult = null;
  const history = [];

  const $expr = $('#exprLine');
  const $main = $('#mainLine');
  const OPS = ['+', '−', '×', '÷'];

  function render(topText) {
    $main.removeClass('error').text(expr === '' ? '0' : expr);
    $expr.text(topText || '');
  }

  function lastChar() { return expr.slice(-1); }
  function trailingNumber() {
    const m = expr.match(/(\d+\.?\d*(e[+-]?\d+)?|\.\d+)$/i);
    return m ? m[0] : '';
  }

  // = 직후 입력: 숫자면 새로 시작, 연산자면 결과에 이어서
  function startFromResult(continueWithResult) {
    if (!justEvaluated) return;
    justEvaluated = false;
    expr = continueWithResult && lastResult !== null ? lastResult : '';
  }

  function inputDigit(d) {
    startFromResult(false);
    expr += d;
    render();
  }

  function inputDot() {
    startFromResult(false);
    const num = trailingNumber();
    if (num.includes('.') || /e/i.test(num)) return;
    expr += num === '' ? '0.' : '.';
    render();
  }

  function inputOperator(op) {
    startFromResult(true);
    const lc = lastChar();
    if (expr === '' || lc === '(') {
      if (op === '−') { expr += op; render(); } // 음수 시작 허용
      return;
    }
    if (OPS.includes(lc)) {
      // 연산자 연속 입력 → 마지막 연산자 교체 (단, "(−" 같은 단항 마이너스는 유지)
      const before = expr.slice(-2, -1);
      if (before === '(' || expr.length === 1) return;
      expr = expr.slice(0, -1);
    }
    expr += op;
    render();
  }

  function inputParen(p) {
    if (p === '(') {
      startFromResult(false);
      expr += '(';
    } else {
      startFromResult(true);
      const open = (expr.match(/\(/g) || []).length;
      const close = (expr.match(/\)/g) || []).length;
      if (open <= close || OPS.includes(lastChar()) || lastChar() === '(') return;
      expr += ')';
    }
    render();
  }

  function inputPostfix(sym) { // ² 또는 %
    startFromResult(true);
    const lc = lastChar();
    if (expr === '' || OPS.includes(lc) || lc === '(' || lc === '√') return;
    expr += sym;
    render();
  }

  function inputSqrt() {
    startFromResult(false);
    expr += '√(';
    render();
  }

  function negate() {
    startFromResult(true);
    const num = trailingNumber();
    if (num === '') {
      const lc = lastChar();
      if (expr === '' || OPS.includes(lc) || lc === '(') { expr += '(−'; render(); }
      return;
    }
    const head = expr.slice(0, expr.length - num.length);
    if (head.endsWith('(−')) {
      expr = head.slice(0, -2) + num;          // (−5 → 5
    } else if (head === '−') {
      expr = num;                              // −5 → 5 (식 맨 앞)
    } else {
      expr = head + '(−' + num;                // 5 → (−5
    }
    render();
  }

  function backspace() {
    if (justEvaluated) { justEvaluated = false; expr = ''; render(); return; }
    expr = expr.endsWith('√(') ? expr.slice(0, -2) : expr.slice(0, -1);
    render();
  }

  function clearAll() {
    expr = '';
    justEvaluated = false;
    render();
  }

  function equals() {
    if (expr === '' || justEvaluated) return;
    // 닫히지 않은 괄호를 자동으로 닫아서 표시
    const open = (expr.match(/\(/g) || []).length - (expr.match(/\)/g) || []).length;
    const full = expr + ')'.repeat(Math.max(0, open));
    const r = Calc.evaluate(full);
    if (r.error) {
      $expr.text(full);
      $main.addClass('error').text(r.error);
      return;
    }
    const res = Calc.format(r.value).replace(/^-/, '−');
    addHistory(full, res);
    $expr.text(full + ' =');
    $main.removeClass('error').text(res);
    lastResult = res;
    expr = res;
    justEvaluated = true;
  }

  /* ── 계산 기록 ── */
  function addHistory(e, res) {
    history.unshift({ expr: e, result: res });
    renderHistory();
  }

  function renderHistory() {
    const $list = $('#historyList').empty();
    if (history.length === 0) {
      $list.append('<li class="empty">기록이 없습니다</li>');
      return;
    }
    history.forEach(function (h, i) {
      $('<li>')
        .attr('data-index', i)
        .attr('title', '클릭하면 이 결과로 이어서 계산합니다')
        .append($('<div class="h-expr">').text(h.expr + ' ='))
        .append($('<div class="h-res">').text(h.result))
        .appendTo($list);
    });
  }

  $('#historyList').on('click', 'li[data-index]', function () {
    const h = history[$(this).data('index')];
    expr = h.result;
    lastResult = h.result;
    justEvaluated = false; // 바로 이어서 입력 가능
    render('기록에서 불러옴: ' + h.expr + ' = ' + h.result);
  });

  $('#clearHistory').on('click', function () {
    history.length = 0;
    renderHistory();
  });

  /* ── 버튼 ── */
  function handleInput(v) {
    if (/^[0-9]$/.test(v)) inputDigit(v);
    else if (v === '.') inputDot();
    else if (OPS.includes(v)) inputOperator(v);
    else if (v === '(' || v === ')') inputParen(v);
  }

  const actions = {
    clear: clearAll, back: backspace, equals: equals, negate: negate,
    sqrt: inputSqrt,
    square: function () { inputPostfix('²'); },
    percent: function () { inputPostfix('%'); }
  };

  $('.keys').on('click', 'button', function () {
    const $b = $(this);
    if ($b.data('input') !== undefined) handleInput(String($b.data('input')));
    else actions[$b.data('action')]();
  });

  /* ── 키보드 ── */
  const keyMap = { '+': '+', '-': '−', '*': '×', '/': '÷', 'x': '×', 'X': '×' };

  function flash(selector) {
    const $b = $(selector).first();
    $b.addClass('pressed');
    setTimeout(function () { $b.removeClass('pressed'); }, 100);
  }

  $(document).on('keydown', function (e) {
    if (!$('#calc').hasClass('active')) return;
    if ($(e.target).is('input, select, textarea')) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;

    if (/^[0-9]$/.test(k) || k === '.' || k === '(' || k === ')') {
      handleInput(k); flash('.keys [data-input="' + k + '"]');
    } else if (keyMap[k]) {
      handleInput(keyMap[k]); flash('.keys [data-input="' + keyMap[k] + '"]');
    } else if (k === 'Enter' || k === '=') {
      equals(); flash('.keys [data-action="equals"]');
    } else if (k === 'Backspace') {
      backspace(); flash('.keys [data-action="back"]');
    } else if (k === 'Escape') {
      clearAll(); flash('.keys [data-action="clear"]');
    } else if (k === '%') {
      actions.percent(); flash('.keys [data-action="percent"]');
    } else if (k === '^') {
      actions.square(); flash('.keys [data-action="square"]');
    } else {
      return;
    }
    e.preventDefault();
  });

  // 버튼 클릭 후 포커스가 남아 Enter가 버튼을 다시 누르는 것을 방지
  $('.keys button').on('mouseup', function () { this.blur(); });

  /* =========================================================
   *  탭 전환
   * ========================================================= */
  $('.tab').on('click', function () {
    $('.tab').removeClass('active');
    $(this).addClass('active');
    $('.panel').removeClass('active');
    $($(this).data('target')).addClass('active');
  });

  /* =========================================================
   *  단위 변환기
   *  각 단위는 기준 단위(m, g, B)에 대한 배율. 온도는 별도 공식.
   * ========================================================= */
  const UNITS = {
    length: {
      units: { mm: 0.001, cm: 0.01, m: 1, km: 1000, inch: 0.0254, ft: 0.3048 },
      defaults: ['m', 'cm']
    },
    weight: {
      units: { g: 1, kg: 1000, lb: 453.59237, oz: 28.349523125 },
      defaults: ['kg', 'lb']
    },
    temperature: {
      units: { '°C': null, '°F': null, 'K': null },
      defaults: ['°C', '°F']
    },
    data: {
      units: { B: 1, KB: 1024, MB: 1024 ** 2, GB: 1024 ** 3, TB: 1024 ** 4 },
      defaults: ['GB', 'MB'],
      note: '1 KB = 1024 B 기준 (이진 단위)'
    }
  };

  function toCelsius(v, u) {
    if (u === '°C') return v;
    if (u === '°F') return (v - 32) * 5 / 9;
    return v - 273.15; // K
  }
  function fromCelsius(c, u) {
    if (u === '°C') return c;
    if (u === '°F') return c * 9 / 5 + 32;
    return c + 273.15;
  }

  function convert(v, from, to, cat) {
    if (cat === 'temperature') return fromCelsius(toCelsius(v, from), to);
    const u = UNITS[cat].units;
    return v * u[from] / u[to];
  }

  function fmt(v) {
    if (Object.is(v, -0)) v = 0;
    const n = parseFloat(v.toPrecision(10));
    if (Math.abs(n) >= 1e15 || (n !== 0 && Math.abs(n) < 1e-6)) return n.toExponential(6);
    return n.toLocaleString('ko-KR', { maximumFractionDigits: 10 });
  }

  const $cat = $('#category'), $from = $('#fromUnit'), $to = $('#toUnit'), $val = $('#fromValue');

  function fillUnits() {
    const cat = UNITS[$cat.val()];
    $from.empty(); $to.empty();
    Object.keys(cat.units).forEach(function (u) {
      $from.append($('<option>').val(u).text(u));
      $to.append($('<option>').val(u).text(u));
    });
    $from.val(cat.defaults[0]);
    $to.val(cat.defaults[1]);
    $('#convNote').text(cat.note || '');
  }

  function updateConversion() {
    const raw = $val.val();
    const v = parseFloat(raw);
    if (raw === '' || isNaN(v)) {
      $('#toValue').text('');
      $('#convSummary').text('값을 입력하세요');
      return;
    }
    const from = $from.val(), to = $to.val(), cat = $cat.val();
    if (cat === 'temperature' && toCelsius(v, from) < -273.15) {
      $('#toValue').text('—');
      $('#convSummary').text('절대영도(−273.15 °C)보다 낮을 수 없습니다');
      return;
    }
    const r = convert(v, from, to, cat);
    $('#toValue').text(fmt(r));
    $('#convSummary').text(fmt(v) + ' ' + from + ' = ' + fmt(r) + ' ' + to);
  }

  $cat.on('change', function () { fillUnits(); updateConversion(); });
  $from.add($to).on('change', updateConversion);
  $val.on('input', updateConversion);

  $('#swapUnits').on('click', function () {
    const f = $from.val();
    $from.val($to.val());
    $to.val(f);
    updateConversion();
  });

  fillUnits();
  updateConversion();
});
</script>
</body>
</html>
