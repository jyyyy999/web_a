<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구구단</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(4, 150px); /* 한 줄에 4개 */
        }
    </style>
</head>
<body>
    <h1>구구단</h1>
    <script>
        document.write("<div class='container'>");

        for (let number = 1; number <= 9; number++){
            document.write("<div>");
            document.write("<h2>" + number + "단</h2>");
            for (let i = 1; i <= 9; i++){
                document.write(number + " * " + i + " = " + (number * i) + "<br>");
            }
            document.write("</div>");
        }

        document.write("</div>");
    </script>
</body>
</html>
